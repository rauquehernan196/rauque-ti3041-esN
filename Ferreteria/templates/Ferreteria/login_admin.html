{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador</title>
    <link rel="stylesheet" href="{% static 'Ferreteria/css/style.css' %}">
</head>
<body class="admin-auth-body">
    <div class="admin-auth-shell">
        <div class="admin-auth-card">
            <div class="admin-auth-brand">
                <div class="brand-mark"></div>
                <span>Ferretería Pro</span>
            </div>
            <h1>Panel administrativo</h1>
            <p>Inicia sesión para gestionar productos y usuarios.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" class="admin-form">
                {% csrf_token %}
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="admin" required>

                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required>

                <button type="submit" class="primary-btn full-width">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
